name: Build Executables for All OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pandas numpy pyinstaller

    - name: Build Executable (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "THE_GAME/cards:cards" THE_GAME/main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --add-data "THE_GAME/cards;cards" THE_GAME/main.py

    # ZIP-Archiv für Linux / macOS erstellen (erhält Dateirechte)
    - name: Zip Output (Linux / macOS)
      if: runner.os != 'Windows'
      run: |
        cd dist
        zip -r ../game-${{ matrix.os }}.zip *

    # ZIP-Archiv für Windows erstellen
    - name: Zip Output (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        Compress-Archive -Path dist/* -DestinationPath game-${{ matrix.os }}.zip

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ matrix.os }}
        path: game-${{ matrix.os }}.zip
