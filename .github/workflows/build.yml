name: Build Executables for All OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pygame pandas numpy pyinstaller

    - name: Build Executable (Linux)
      if: runner.os == 'Linux'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --icon="THE_GAME/assets/icon.png" \
          --add-data "THE_GAME/cards:THE_GAME/cards" \
          THE_GAME/main.py
          
    - name: Build Executable (macOS)
      if: runner.os == 'macOS'
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --icon="THE_GAME/assets/icon.icns" \
          --add-data "THE_GAME/cards:THE_GAME/cards" \
          THE_GAME/main.py

    - name: Build Executable (Windows)
      if: runner.os == 'Windows'
      run: |
        pyinstaller --noconfirm --onedir --windowed --icon="THE_GAME/assets/icon.ico" --add-data "THE_GAME/cards;THE_GAME/cards" THE_GAME/main.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: game-${{ matrix.os }}
        path: dist/
